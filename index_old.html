<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 動態菜單與點餐系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid #ffffff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col relative">

    <!-- 頂部導覽與 Tab 切換 -->
    <nav class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <span class="text-xl font-bold text-indigo-600 flex items-center gap-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        AI Menu & Order
                    </span>
                </div>
                <div class="flex items-center space-x-4">
                    <button onclick="switchTab('admin')" id="tab-admin" class="px-4 py-2 rounded-md font-medium text-sm transition-colors bg-indigo-50 text-indigo-700">管理者後台</button>
                    <button onclick="switchTab('customer')" id="tab-customer" class="px-4 py-2 rounded-md font-medium text-sm transition-colors text-slate-600 hover:bg-slate-50">顧客點餐</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主要內容區 -->
    <main class="flex-grow max-w-5xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">

        <!-- ==================== 管理者後台 (Admin Panel) ==================== -->
        <section id="admin-view" class="space-y-8 block">
            
            <!-- 區塊 1: 菜單管理 -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-xl font-bold mb-4 flex items-center gap-2 text-slate-800">
                    <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                    1. 菜單管理 (上傳與 AI 辨識)
                </h2>
                <div class="flex items-center justify-center w-full">
                    <label for="dropzone-file" class="flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-slate-300 rounded-xl cursor-pointer bg-slate-50 hover:bg-slate-100 transition">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6 text-slate-500">
                            <svg class="w-8 h-8 mb-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                            <p class="mb-2 text-sm font-semibold">點擊上傳菜單圖片</p>
                        </div>
                        <input id="dropzone-file" type="file" accept="image/*" class="hidden" onchange="handleImageUpload(event)" />
                    </label>
                </div>
                
                <div id="preview-container" class="hidden mt-6 text-center">
                    <img id="image-preview" class="max-w-full h-auto max-h-48 rounded-lg border border-slate-200 shadow-sm mx-auto mb-4" />
                    <button id="analyze-btn" onclick="analyzeImage()" class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-lg font-medium transition shadow-sm">
                        <span id="analyze-text">交給 AI 辨識</span>
                        <div id="analyze-spinner" class="spinner hidden"></div>
                    </button>
                </div>
            </div>

            <!-- 人工校正區塊 -->
            <div id="editor-container" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-slate-100 transition-all duration-500 opacity-0 transform translate-y-4">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold">人工校正區</h2>
                    <button onclick="publishMenu()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-5 py-2 rounded-lg font-medium transition shadow-sm">發布菜單</button>
                </div>
                <div id="editor-form" class="space-y-6"></div>
            </div>

            <!-- 區塊 2: 訂單看板 -->
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-xl font-bold mb-4 flex items-center gap-2 text-slate-800">
                    <svg class="w-5 h-5 text-amber-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"></path></svg>
                    2. 即時訂單看板
                </h2>
                
                <div id="no-orders" class="text-center py-10 text-slate-400">
                    <p>目前尚無新訂單</p>
                </div>

                <div id="orders-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden">
                    <!-- 管理端訂單卡片會產生在這裡 -->
                </div>
            </div>
        </section>

        <!-- ==================== 顧客點餐前台 (Customer View) ==================== -->
        <section id="customer-view" class="hidden space-y-6">
            
            <div id="empty-state" class="flex flex-col items-center justify-center py-20 text-slate-400">
                <svg class="w-16 h-16 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                <h3 class="text-xl font-medium text-slate-600">請等待店家發布菜單</h3>
            </div>

            <div id="menu-display" class="hidden">
                <div class="flex justify-between items-end mb-6 sticky top-16 bg-slate-50 py-4 z-30">
                    <h1 class="text-3xl font-bold text-slate-800">美味菜單</h1>
                    <!-- 點擊打開購物車 -->
                    <button onclick="openCartModal()" class="text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 px-5 py-2.5 rounded-full shadow-lg transition-transform hover:scale-105 flex items-center gap-2">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                        查看購物車 (<span id="cart-count">0</span>)
                    </button>
                </div>
                <div id="menu-grid" class="space-y-8">
                    <!-- 菜單會產生在這裡 -->
                </div>
            </div>
        </section>

    </main>

    <!-- ==================== 購物車結帳彈出視窗 (Modal) ==================== -->
    <div id="cart-modal" class="fixed inset-0 bg-slate-900/60 z-50 hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl flex flex-col max-h-[90vh] transform scale-95 transition-transform duration-300" id="cart-modal-content">
            
            <div class="p-5 border-b border-slate-100 flex justify-between items-center">
                <h3 class="text-xl font-bold text-slate-800">您的購物車</h3>
                <button onclick="closeCartModal()" class="text-slate-400 hover:text-slate-600">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>
            
            <!-- 購物車內容列表 -->
            <div class="p-5 overflow-y-auto flex-grow" id="cart-items-container">
                <!-- 動態載入購物車項目 -->
            </div>

            <!-- 結帳表單區 -->
            <div class="p-5 border-t border-slate-100 bg-slate-50 rounded-b-2xl">
                <div class="flex justify-between items-center mb-4">
                    <span class="font-bold text-slate-600">總金額:</span>
                    <span class="text-2xl font-black text-indigo-600">NT$ <span id="cart-total-price">0</span></span>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1">顧客姓名</label>
                    <input type="text" id="customer-name" placeholder="請輸入您的稱呼" class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none">
                </div>
                <button onclick="submitOrder()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl transition shadow-md flex justify-center items-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
                    確認送出訂單
                </button>
            </div>
        </div>
    </div>

    <script>
        /**
         * ==========================================
         * 1. 系統設定與全域變數
         * ==========================================
         */
        const GEMINI_API_KEY = prompt("請輸入你的 Gemini API Key (測試用)："); 
        
        let base64Image = "";
        let imageMimeType = "image/jpeg"; 
        let parsedMenuData = [];     
        let publishedMenuData = [];  
        
        // 購物車與訂單系統
        let cart = [];               
        let orders = [];             

        /**
         * ==========================================
         * 2. 介面切換邏輯
         * ==========================================
         */
        function switchTab(tab) {
            const adminView = document.getElementById('admin-view');
            const customerView = document.getElementById('customer-view');
            const tabAdmin = document.getElementById('tab-admin');
            const tabCustomer = document.getElementById('tab-customer');

            if (tab === 'admin') {
                adminView.classList.remove('hidden');
                customerView.classList.add('hidden');
                tabAdmin.className = "px-4 py-2 rounded-md font-medium text-sm transition-colors bg-indigo-50 text-indigo-700";
                tabCustomer.className = "px-4 py-2 rounded-md font-medium text-sm transition-colors text-slate-600 hover:bg-slate-50";
                
                // 切回管理端時，重新渲染一次訂單，確保最新
                renderAdminOrders();
            } else {
                adminView.classList.add('hidden');
                customerView.classList.remove('hidden');
                tabCustomer.className = "px-4 py-2 rounded-md font-medium text-sm transition-colors bg-indigo-50 text-indigo-700";
                tabAdmin.className = "px-4 py-2 rounded-md font-medium text-sm transition-colors text-slate-600 hover:bg-slate-50";
                
                renderCustomerMenu();
            }
        }

        /**
         * ==========================================
         * 3. 菜單解析與發布 (原有功能)
         * ==========================================
         */
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            imageMimeType = file.type || "image/jpeg";
            const reader = new FileReader();
            reader.onload = function(e) {
                const result = e.target.result;
                document.getElementById('image-preview').src = result;
                document.getElementById('preview-container').classList.remove('hidden');
                base64Image = result.split(',')[1];
            };
            reader.readAsDataURL(file);
        }

        async function analyzeImage() {
            if (!GEMINI_API_KEY) return alert("請輸入您的 GEMINI_API_KEY！");
            if (!base64Image) return alert("請先上傳圖片！");

            const btn = document.getElementById('analyze-btn');
            const text = document.getElementById('analyze-text');
            const spinner = document.getElementById('analyze-spinner');
            
            btn.disabled = true; btn.classList.add('opacity-80', 'cursor-not-allowed');
            text.innerText = "AI 努力辨識中..."; spinner.classList.remove('hidden');

            try {
                // 注意：使用 gemini-3.6-flash
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3.6-flash:generateContent?key=${GEMINI_API_KEY}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: `Extract menu items and prices. Return ONLY a valid JSON array. Structure: [{"category": "Name", "items": [{"name": "Item", "price": 150}]}]` },
                                { inline_data: { mime_type: imageMimeType, data: base64Image } }
                            ]
                        }],
                        generationConfig: { temperature: 0.1 }
                    })
                });

                if (!response.ok) throw new Error(`API 失敗: ${response.status}`);

                const data = await response.json();
                let rawText = data.candidates[0].content.parts[0].text.replace(/```json/g, '').replace(/```/g, '').trim();
                parsedMenuData = JSON.parse(rawText);
                
                renderEditorForm();
                
                const editor = document.getElementById('editor-container');
                editor.classList.remove('hidden');
                setTimeout(() => editor.classList.remove('opacity-0', 'translate-y-4'), 50);

            } catch (error) {
                alert("辨識失敗：" + error.message);
            } finally {
                btn.disabled = false; btn.classList.remove('opacity-80', 'cursor-not-allowed');
                text.innerText = "重新辨識"; spinner.classList.add('hidden');
            }
        }

        function renderEditorForm() {
            const container = document.getElementById('editor-form');
            container.innerHTML = '';
            parsedMenuData.forEach((cat, cIndex) => {
                let html = `<div class="bg-slate-50 p-4 rounded-xl border border-slate-200"><div class="mb-3"><input type="text" value="${cat.category}" onchange="updateData(${cIndex}, null, 'category', this.value)" class="px-3 py-1.5 border rounded-md font-bold text-slate-700 w-full max-w-xs"></div><table class="w-full bg-white rounded-lg shadow-sm"><tbody>`;
                cat.items.forEach((item, iIndex) => {
                    html += `<tr><td class="p-2 border-b"><input type="text" value="${item.name}" onchange="updateData(${cIndex}, ${iIndex}, 'name', this.value)" class="w-full p-1 border hover:border-slate-300 rounded"></td><td class="p-2 border-b w-24"><input type="number" value="${item.price}" onchange="updateData(${cIndex}, ${iIndex}, 'price', this.value)" class="w-full p-1 border hover:border-slate-300 rounded"></td></tr>`;
                });
                container.innerHTML += html + `</tbody></table></div>`;
            });
        }

        function updateData(c, i, f, v) { i === null ? parsedMenuData[c][f] = v : parsedMenuData[c].items[i][f] = f === 'price' ? Number(v) : v; }

        function publishMenu() {
            if (parsedMenuData.length === 0) return alert("沒有資料可以發布！");
            publishedMenuData = JSON.parse(JSON.stringify(parsedMenuData));
            switchTab('customer');
            alert("🎉 菜單發布成功！顧客可以開始點餐了。");
        }

        function renderCustomerMenu() {
            if (publishedMenuData.length === 0) return;
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('menu-display').classList.remove('hidden');
            
            let grid = document.getElementById('menu-grid');
            grid.innerHTML = '';
            publishedMenuData.forEach(cat => {
                let html = `<div><h2 class="text-xl font-bold text-slate-800 border-l-4 border-indigo-500 pl-3 mb-4">${cat.category}</h2><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">`;
                cat.items.forEach(item => {
                    html += `<div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between"><h3 class="font-bold text-lg">${item.name}</h3><p class="text-xl font-black text-slate-700 mt-2"><span class="text-sm">NT$</span>${item.price}</p><button onclick="addToCart('${item.name}', ${item.price})" class="mt-4 bg-slate-100 hover:bg-indigo-600 hover:text-white text-slate-700 font-medium py-2 rounded-xl transition flex justify-center items-center gap-2"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>加入</button></div>`;
                });
                grid.innerHTML += html + `</div></div>`;
            });
        }

        /**
         * ==========================================
         * 4. 購物車與結帳邏輯
         * ==========================================
         */
        function addToCart(name, price) {
            cart.push({ name, price });
            updateCartCount();
        }

        function updateCartCount() {
            const countBtn = document.getElementById('cart-count');
            countBtn.innerText = cart.length;
            countBtn.parentElement.classList.add('scale-110');
            setTimeout(() => countBtn.parentElement.classList.remove('scale-110'), 200);
        }

        function openCartModal() {
            const modal = document.getElementById('cart-modal');
            const content = document.getElementById('cart-modal-content');
            const itemsContainer = document.getElementById('cart-items-container');
            const totalPriceEl = document.getElementById('cart-total-price');
            
            // 渲染購物車清單
            itemsContainer.innerHTML = '';
            let total = 0;

            if (cart.length === 0) {
                itemsContainer.innerHTML = '<p class="text-center text-slate-400 py-6">購物車是空的</p>';
            } else {
                cart.forEach((item, index) => {
                    total += item.price;
                    itemsContainer.innerHTML += `
                        <div class="flex justify-between items-center py-3 border-b border-slate-50">
                            <span class="font-medium text-slate-700">${item.name}</span>
                            <div class="flex items-center gap-4">
                                <span class="font-bold text-slate-600">$${item.price}</span>
                                <button onclick="removeFromCart(${index})" class="text-red-400 hover:text-red-600 text-sm">刪除</button>
                            </div>
                        </div>
                    `;
                });
            }

            totalPriceEl.innerText = total;

            // 顯示動畫
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.remove('scale-95');
            }, 10);
        }

        function closeCartModal() {
            const modal = document.getElementById('cart-modal');
            const content = document.getElementById('cart-modal-content');
            modal.classList.add('opacity-0');
            content.classList.add('scale-95');
            setTimeout(() => modal.classList.add('hidden'), 300);
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartCount();
            openCartModal(); // 重新渲染視窗
        }

        function submitOrder() {
            if (cart.length === 0) return alert("購物車沒有東西唷！");
            
            const nameInput = document.getElementById('customer-name');
            const customerName = nameInput.value.trim();
            if (!customerName) return alert("請輸入您的姓名，方便我們為您送餐！");

            // 建立訂單物件
            const newOrder = {
                id: 'ORD-' + Math.floor(Math.random() * 10000), // 產生簡易單號
                customerName: customerName,
                time: new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit' }),
                items: [...cart], // 複製陣列
                total: cart.reduce((sum, item) => sum + item.price, 0),
                status: 'pending' // 處理中
            };

            // 存入全域訂單陣列
            orders.unshift(newOrder); // 放進最前面(最新)

            // 清空購物車
            cart = [];
            updateCartCount();
            nameInput.value = '';
            
            closeCartModal();
            alert(`✅ 訂單送出成功！\n${customerName} 您好，店家已收到您的訂單。`);
        }

        /**
         * ==========================================
         * 5. 管理端接收訂單看板
         * ==========================================
         */
        function renderAdminOrders() {
            const noOrders = document.getElementById('no-orders');
            const ordersGrid = document.getElementById('orders-grid');

            if (orders.length === 0) {
                noOrders.classList.remove('hidden');
                ordersGrid.classList.add('hidden');
                return;
            }

            noOrders.classList.add('hidden');
            ordersGrid.classList.remove('hidden');
            ordersGrid.innerHTML = '';

            // 渲染所有訂單
            orders.forEach((order, index) => {
                // 如果是已完成的，調整顏色
                const isDone = order.status === 'completed';
                const cardBg = isDone ? 'bg-slate-100 opacity-60' : 'bg-white border-indigo-100 border-2';
                
                // 整理餐點文字
                const itemsText = order.items.map(i => i.name).join('、');

                ordersGrid.innerHTML += `
                    <div class="${cardBg} p-5 rounded-xl shadow-sm transition-all flex flex-col justify-between">
                        <div>
                            <div class="flex justify-between items-start mb-2">
                                <span class="text-xs font-bold bg-slate-800 text-white px-2 py-1 rounded">${order.id}</span>
                                <span class="text-sm text-slate-500 font-medium">${order.time}</span>
                            </div>
                            <h3 class="text-lg font-bold text-slate-800 mb-1">顧客: ${order.customerName}</h3>
                            <p class="text-sm text-slate-600 mb-4 line-clamp-2" title="${itemsText}">${itemsText}</p>
                        </div>
                        
                        <div class="flex justify-between items-center mt-2 pt-3 border-t border-slate-200">
                            <span class="font-black text-indigo-600">NT$ ${order.total}</span>
                            ${!isDone ? 
                                `<button onclick="completeOrder(${index})" class="text-xs font-bold bg-emerald-100 text-emerald-700 hover:bg-emerald-200 px-3 py-1.5 rounded transition">標記完成</button>` 
                                : 
                                `<span class="text-xs font-bold text-slate-400">已出餐</span>`
                            }
                        </div>
                    </div>
                `;
            });
        }

        function completeOrder(index) {
            orders[index].status = 'completed';
            renderAdminOrders(); // 重新渲染看板
        }
