<!DOCTYPE html>
<html lang="zh-TW" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美味線上點餐</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style> 
        body { font-family: 'Noto Sans TC', sans-serif; } 
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
        input[type="number"] { -moz-appearance: textfield; }
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col relative">

    <nav class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center h-16">
            <span class="text-xl font-bold text-indigo-600">美味點餐</span>
            <button onclick="openCartModal()" class="text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 px-5 py-2.5 rounded-full shadow-lg transition-transform hover:scale-105">
                🛒 購物車 (<span id="cart-count">0</span>)
            </button>
        </div>
    </nav>

    <main class="flex-grow max-w-5xl mx-auto w-full px-4 py-6">
        <div id="loading-state" class="flex flex-col items-center justify-center py-20 text-slate-500">
            <svg class="animate-spin h-10 w-10 text-indigo-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <p>正在載入最新菜單...</p>
        </div>

        <div id="menu-container" class="hidden">
            <!-- 💡 修正 1：不管幾個菜單，頂部導覽列都會顯示 -->
            <div id="menu-tabs" class="flex gap-2 overflow-x-auto pb-4 mb-2 hide-scrollbar"></div>
            
            <div id="category-nav" class="sticky top-16 bg-slate-50 z-30 py-3 mb-4 flex gap-2 overflow-x-auto hide-scrollbar shadow-sm border-b border-slate-200 px-2 -mx-2"></div>

            <!-- 💡 修正 2：原始菜單圖片按鈕 -->
            <div id="original-image-btn-container" class="mb-4"></div>

            <div id="menu-grid" class="space-y-8"></div>
        </div>
    </main>

    <!-- 購物車 Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-slate-900/60 z-50 hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-5 border-b border-slate-100 flex justify-between items-center">
                <h3 class="text-xl font-bold">您的購物車</h3>
                <button onclick="closeCartModal()" class="text-slate-400 hover:text-slate-600 text-2xl font-bold">✕</button>
            </div>
            <div class="p-5 overflow-y-auto flex-grow" id="cart-items-container"></div>
            <div class="p-5 border-t border-slate-100 bg-slate-50 rounded-b-2xl">
                <div class="flex justify-between items-center mb-4">
                    <span class="font-bold">總金額:</span>
                    <span class="text-2xl font-black text-indigo-600">NT$ <span id="cart-total-price">0</span></span>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1">您的稱呼 / 桌號</label>
                    <input type="text" id="customer-name" placeholder="例如：王先生 或 3桌" class="w-full px-4 py-2 border rounded-lg focus:ring-2 outline-none">
                </div>
                <button id="submit-btn" onclick="submitOrder()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl transition shadow-md">
                    確認送出訂單
                </button>
            </div>
        </div>
    </div>

    <!-- 單項餐點客製化視窗 -->
    <div id="item-modal" class="fixed inset-0 bg-slate-900/60 z-50 hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-6">
            <h3 id="modal-item-name" class="text-xl font-bold mb-2">餐點名稱</h3>
            <p class="text-indigo-600 font-bold mb-4">NT$ <span id="modal-item-price">0</span></p>
            <div class="mb-4">
                <label class="block text-sm font-medium text-slate-700 mb-1">數量</label>
                <div class="flex items-center gap-3">
                    <button onclick="changeQty(-1)" class="bg-slate-100 hover:bg-slate-200 w-10 h-10 rounded-full font-bold text-lg">-</button>
                    <input type="number" id="modal-item-qty" value="1" min="1" onchange="handleManualQty(this.value)" class="text-lg font-bold w-16 h-10 text-center border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-slate-50">
                    <button onclick="changeQty(1)" class="bg-slate-100 hover:bg-slate-200 w-10 h-10 rounded-full font-bold text-lg">+</button>
                </div>
            </div>
            <div class="mb-6">
                <label class="block text-sm font-medium text-slate-700 mb-1">備註 (選填)</label>
                <input type="text" id="modal-item-remark" placeholder="例如：不要蔥、微辣..." class="w-full px-3 py-2 border rounded-lg focus:ring-2 outline-none">
            </div>
            <div class="flex gap-3">
                <button onclick="closeItemModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2 rounded-xl transition">取消</button>
                <button onclick="confirmAddToCart()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-xl transition">確定加入</button>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ 請填入你最新部署的 GAS URL
        const GAS_URL = "https://script.google.com/macros/s/AKfycbxR7DmqJwrkpdY2qugB7zN625AGHxZZZU7uAPa13IazSd8RJW_JCrQnw9O1Yo2sodhTqw/exec"; 

        let publishedMenus = []; 
        let cart = [];
        let currentSelectedItem = null;
        let activeMenuName = "未分類菜單"; 

        async function fetchMenu() {
            if (!GAS_URL) return;
            try {
                const res = await fetch(GAS_URL + '?action=getMenu');
                const result = await res.json();
                let allData = result.data || [];
                publishedMenus = allData.filter(m => m.isPublished === true);
                document.getElementById('loading-state').classList.add('hidden');
                
                if (publishedMenus.length === 0) {
                    document.getElementById('loading-state').classList.remove('hidden');
                    document.getElementById('loading-state').innerHTML = "<h3 class='text-lg font-bold text-slate-600'>目前店家尚未發布任何菜單...</h3>";
                } else {
                    document.getElementById('menu-container').classList.remove('hidden');
                    renderMenuTabs();
                    selectMenu(publishedMenus[0].id); 
                }
            } catch(e) {
                document.getElementById('loading-state').innerHTML = "<p>載入失敗，請重新整理</p>";
            }
        }

        function renderMenuTabs() {
            const tabsContainer = document.getElementById('menu-tabs');
            // 💡 不再隱藏 Tabs，就算只有 1 個也要顯示
            tabsContainer.classList.remove('hidden');
            tabsContainer.innerHTML = publishedMenus.map(menu => `
                <button id="tab-${menu.id}" onclick="selectMenu('${menu.id}')" class="whitespace-nowrap px-5 py-2 rounded-full font-bold text-sm transition-colors border">
                    ${menu.name}
                </button>
            `).join('');
        }

        function selectMenu(id) {
            publishedMenus.forEach(menu => {
                const btn = document.getElementById(`tab-${menu.id}`);
                if(btn) {
                    if(menu.id === id) {
                        btn.className = "whitespace-nowrap px-5 py-2 rounded-full font-bold text-sm transition-colors bg-slate-800 text-white border border-slate-800";
                        activeMenuName = menu.name; 
                    } else {
                        btn.className = "whitespace-nowrap px-5 py-2 rounded-full font-bold text-sm transition-colors bg-white text-slate-600 border border-slate-200 hover:bg-slate-50";
                    }
                }
            });

            const selectedMenu = publishedMenus.find(m => m.id === id);
            if(selectedMenu) {
                renderMenuContent(selectedMenu.data, selectedMenu.imageUrl);
            }
        }

        function renderMenuContent(menuData, imageUrl) {
            const grid = document.getElementById('menu-grid');
            const catNav = document.getElementById('category-nav');
            const imgBtnContainer = document.getElementById('original-image-btn-container');
            
            grid.innerHTML = '';
            catNav.innerHTML = ''; 

            // 💡 產生「點我看原始菜單」按鈕
            if (imageUrl) {
                imgBtnContainer.innerHTML = `
                    <a href="${imageUrl}" target="_blank" class="inline-flex items-center justify-center gap-2 w-full sm:w-auto px-6 py-2.5 bg-indigo-100 text-indigo-700 rounded-xl font-bold text-sm hover:bg-indigo-200 transition shadow-sm border border-indigo-200">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                        點我看原始菜單
                    </a>`;
                imgBtnContainer.classList.remove('hidden');
            } else {
                imgBtnContainer.classList.add('hidden');
            }
            
            menuData.forEach((cat, index) => {
                catNav.innerHTML += `<button onclick="scrollToCategory('cat-${index}')" class="whitespace-nowrap px-4 py-1.5 bg-white border border-slate-200 rounded-full text-slate-700 font-bold hover:bg-indigo-50 hover:text-indigo-600 transition shadow-sm text-sm">${cat.category}</button>`;
                
                let html = `<div id="cat-${index}" style="scroll-margin-top: 130px;"><h2 class="text-xl font-bold border-l-4 border-indigo-500 pl-3 mb-4">${cat.category}</h2><div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">`;
                cat.items.forEach(item => {
                    html += `
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between hover:shadow-md transition">
                            <h3 class="font-bold text-lg">${item.name}</h3>
                            <p class="text-xl font-black mt-2 text-slate-700"><span class="text-sm">NT$</span>${item.price}</p>
                            <button onclick="openItemModal('${item.name}', ${item.price})" class="mt-4 bg-slate-50 border border-slate-200 hover:border-indigo-500 hover:bg-indigo-50 hover:text-indigo-700 font-bold py-2.5 rounded-xl transition">
                                + 加入購物車
                            </button>
                        </div>
                    `;
                });
                grid.innerHTML += html + `</div></div>`;
            });
        }

        function scrollToCategory(elementId) {
            const el = document.getElementById(elementId);
            if(el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        function openItemModal(name, price) {
            currentSelectedItem = { name, price, qty: 1, menuName: activeMenuName };
            document.getElementById('modal-item-name').innerText = name;
            document.getElementById('modal-item-price').innerText = price;
            document.getElementById('modal-item-qty').value = 1; 
            document.getElementById('modal-item-remark').value = '';
            
            const modal = document.getElementById('item-modal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
        }

        function changeQty(delta) {
            let qtyInput = document.getElementById('modal-item-qty');
            let currentQty = parseInt(qtyInput.value) || 1;
            let newQty = currentQty + delta;
            if (newQty < 1) newQty = 1;
            currentSelectedItem.qty = newQty;
            qtyInput.value = newQty;
        }

        function handleManualQty(value) {
            let newQty = parseInt(value);
            if (isNaN(newQty) || newQty < 1) newQty = 1;
            currentSelectedItem.qty = newQty;
            document.getElementById('modal-item-qty').value = newQty;
        }

        function closeItemModal() {
            document.getElementById('item-modal').classList.add('opacity-0');
            setTimeout(() => document.getElementById('item-modal').classList.add('hidden'), 300);
        }

        function confirmAddToCart() {
            const remark = document.getElementById('modal-item-remark').value.trim();
            cart.push({
                name: currentSelectedItem.name,
                price: currentSelectedItem.price,
                qty: currentSelectedItem.qty,
                remark: remark,
                menuName: currentSelectedItem.menuName 
            });
            
            const cartCount = document.getElementById('cart-count');
            cartCount.innerText = cart.length;
            cartCount.parentElement.classList.add('scale-125');
            setTimeout(() => cartCount.parentElement.classList.remove('scale-125'), 200);

            closeItemModal();
        }

        function openCartModal() {
            const modal = document.getElementById('cart-modal');
            const itemsContainer = document.getElementById('cart-items-container');
            let total = 0;
            itemsContainer.innerHTML = '';

            if (cart.length === 0) {
                itemsContainer.innerHTML = '<p class="text-center text-slate-400 py-6">購物車是空的</p>';
            } else {
                cart.forEach((item, index) => {
                    let itemTotal = item.price * item.qty;
                    total += itemTotal;
                    let remarkHtml = item.remark ? `<span class="text-xs text-red-500 font-bold ml-2">(${item.remark})</span>` : '';
                    let menuTagHtml = `<span class="text-[10px] bg-slate-100 text-slate-500 px-2 py-0.5 rounded mr-2">${item.menuName}</span>`;

                    itemsContainer.innerHTML += `
                        <div class="flex justify-between items-center py-3 border-b border-slate-100">
                            <div>
                                <div class="mb-1">${menuTagHtml}</div>
                                <span class="font-bold text-slate-800">${item.name}</span>
                                <span class="text-xs text-slate-500 font-bold ml-1">($${item.price})</span>
                                <span class="text-indigo-600 font-bold ml-2">x ${item.qty}</span>
                                ${remarkHtml}
                            </div>
                            <div class="flex items-center gap-4">
                                <span class="font-bold text-slate-600">$${itemTotal}</span>
                                <button onclick="removeFromCart(${index})" class="text-red-400 hover:text-red-600 text-sm font-bold">刪除</button>
                            </div>
                        </div>
                    `;
                });
            }
            
            document.getElementById('cart-total-price').innerText = total;
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
        }

        function closeCartModal() {
            document.getElementById('cart-modal').classList.add('opacity-0');
            setTimeout(() => document.getElementById('cart-modal').classList.add('hidden'), 300);
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            document.getElementById('cart-count').innerText = cart.length;
            openCartModal();
        }

        async function submitOrder() {
            if (cart.length === 0) return alert("購物車空的喔！");
            const customerName = document.getElementById('customer-name').value.trim();
            if (!customerName) return alert("請輸入稱呼或桌號！");

            const btn = document.getElementById('submit-btn');
            btn.disabled = true; btn.innerText = "傳送中...";

            const newOrder = {
                id: 'ORD-' + Math.floor(Math.random() * 10000),
                customerName: customerName,
                time: new Date().toLocaleString("zh-TW"),
                items: cart,
                total: cart.reduce((sum, item) => sum + (item.price * item.qty), 0),
                status: 'pending'
            };

            try {
                await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'addOrder', data: newOrder }) });
                cart = [];
                document.getElementById('cart-count').innerText = "0";
                document.getElementById('customer-name').value = '';
                closeCartModal();
                alert(`✅ 訂單送出成功！店家已收到您的訂單。`);
            } catch(e) {
                alert("傳送失敗，請重試！");
            } finally {
                btn.disabled = false; btn.innerText = "確認送出訂單";
            }
        }

        window.onload = fetchMenu;
    </script>
</body>
</html>
