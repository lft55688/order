<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 動態菜單管理系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        /* 自定義卷軸樣式 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; }
        ::-webkit-scrollbar-thumb { background: #c1c1c1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a8a8a8; }
        .spinner {
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top: 3px solid #ffffff;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- 頂部導覽與 Tab 切換 -->
    <nav class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center">
                    <span class="text-xl font-bold text-indigo-600 flex items-center gap-2">
                        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                        AI Menu System
                    </span>
                </div>
                <div class="flex items-center space-x-4">
                    <button onclick="switchTab('admin')" id="tab-admin" class="px-4 py-2 rounded-md font-medium text-sm transition-colors bg-indigo-50 text-indigo-700">管理者後台</button>
                    <button onclick="switchTab('customer')" id="tab-customer" class="px-4 py-2 rounded-md font-medium text-sm transition-colors text-slate-600 hover:bg-slate-50">顧客點餐</button>
                </div>
            </div>
        </div>
    </nav>

    <!-- 主要內容區 -->
    <main class="flex-grow max-w-5xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">

        <!-- ==================== 管理者後台 (Admin Panel) ==================== -->
        <section id="admin-view" class="space-y-6 block">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h2 class="text-lg font-bold mb-4">1. 上傳菜單圖片</h2>
                <div class="flex items-center justify-center w-full">
                    <label for="dropzone-file" class="flex flex-col items-center justify-center w-full h-48 border-2 border-dashed border-slate-300 rounded-xl cursor-pointer bg-slate-50 hover:bg-slate-100 transition">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6 text-slate-500">
                            <svg class="w-10 h-10 mb-3 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                            <p class="mb-2 text-sm font-semibold">點擊上傳圖片</p>
                            <p class="text-xs">支援 PNG, JPG, JPEG</p>
                        </div>
                        <input id="dropzone-file" type="file" accept="image/*" class="hidden" onchange="handleImageUpload(event)" />
                    </label>
                </div>
                
                <!-- 預覽區塊 -->
                <div id="preview-container" class="hidden mt-6">
                    <p class="text-sm font-medium text-slate-700 mb-2">圖片預覽：</p>
                    <img id="image-preview" class="max-w-full h-auto max-h-64 rounded-lg border border-slate-200 shadow-sm mx-auto" />
                    <div class="mt-4 flex justify-center">
                        <button id="analyze-btn" onclick="analyzeImage()" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-lg font-medium transition shadow-sm">
                            <span id="analyze-text">交給 AI 辨識</span>
                            <div id="analyze-spinner" class="spinner hidden"></div>
                        </button>
                    </div>
                </div>
            </div>

            <!-- 人工校正區塊 (初始隱藏) -->
            <div id="editor-container" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-slate-100 transition-all duration-500 opacity-0 transform translate-y-4">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-lg font-bold">2. 人工校正 (AI 辨識結果)</h2>
                    <button onclick="publishMenu()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-5 py-2 rounded-lg font-medium transition shadow-sm">發布菜單</button>
                </div>
                <p class="text-sm text-slate-500 mb-4">請確認 AI 辨識的內容是否正確，您可以直接在此處修改文字與價格。</p>
                <div id="editor-form" class="space-y-6">
                    <!-- 動態產生可編輯表單的地方 -->
                </div>
            </div>
        </section>

        <!-- ==================== 顧客點餐前台 (Customer View) ==================== -->
        <section id="customer-view" class="hidden space-y-6">
            
            <!-- 未發布時的空狀態 -->
            <div id="empty-state" class="flex flex-col items-center justify-center py-20 text-slate-400">
                <svg class="w-16 h-16 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                <h3 class="text-xl font-medium text-slate-600">請等待店家發布菜單</h3>
                <p class="text-sm mt-1">目前沒有可用的餐點資訊</p>
            </div>

            <!-- 菜單展示區 -->
            <div id="menu-display" class="hidden">
                <div class="flex justify-between items-end mb-6">
                    <h1 class="text-3xl font-bold text-slate-800">美味菜單</h1>
                    <div class="text-sm font-medium text-slate-600 bg-white px-4 py-2 rounded-full shadow-sm border border-slate-100 flex items-center gap-2">
                        <svg class="w-5 h-5 text-indigo-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                        購物車: <span id="cart-count" class="text-indigo-600 font-bold">0</span> 項
                    </div>
                </div>
                <div id="menu-grid" class="space-y-8">
                    <!-- 動態產生顧客視角菜單的地方 -->
                </div>
            </div>
        </section>

    </main>

    <script>
        /**
         * ==========================================
         * 1. 系統設定與全域變數
         * ==========================================
         */
        // 使用 prompt 讓使用者輸入 API Key
        const GEMINI_API_KEY = prompt("請輸入你的 Gemini API Key："); 
        
        let base64Image = "";
        let imageMimeType = "image/jpeg"; // 預設 MIME 類型
        let parsedMenuData = [];     // 存放 AI 解析後/編輯中的資料
        let publishedMenuData = [];  // 正式發布的資料
        let cart = [];               // 顧客購物車

        /**
         * ==========================================
         * 2. 介面切換邏輯
         * ==========================================
         */
        function switchTab(tab) {
            const adminView = document.getElementById('admin-view');
            const customerView = document.getElementById('customer-view');
            const tabAdmin = document.getElementById('tab-admin');
            const tabCustomer = document.getElementById('tab-customer');

            if (tab === 'admin') {
                adminView.classList.remove('hidden');
                customerView.classList.add('hidden');
                
                tabAdmin.className = "px-4 py-2 rounded-md font-medium text-sm transition-colors bg-indigo-50 text-indigo-700";
                tabCustomer.className = "px-4 py-2 rounded-md font-medium text-sm transition-colors text-slate-600 hover:bg-slate-50";
            } else {
                adminView.classList.add('hidden');
                customerView.classList.remove('hidden');
                
                tabCustomer.className = "px-4 py-2 rounded-md font-medium text-sm transition-colors bg-indigo-50 text-indigo-700";
                tabAdmin.className = "px-4 py-2 rounded-md font-medium text-sm transition-colors text-slate-600 hover:bg-slate-50";
                
                renderCustomerMenu();
            }
        }

        /**
         * ==========================================
         * 3. 管理者後台邏輯 (圖片上傳、預覽、AI 辨識)
         * ==========================================
         */
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            imageMimeType = file.type || "image/jpeg"; // 自動取得圖片真實格式

            const reader = new FileReader();
            reader.onload = function(e) {
                const result = e.target.result;
                // 顯示預覽
                const previewImg = document.getElementById('image-preview');
                previewImg.src = result;
                document.getElementById('preview-container').classList.remove('hidden');
                
                // 擷取 Base64 的純資料部分
                base64Image = result.split(',')[1];
            };
            reader.readAsDataURL(file);
        }

        async function analyzeImage() {
            if (!GEMINI_API_KEY) {
                alert("請輸入您的 GEMINI_API_KEY！");
                return;
            }
            if (!base64Image) {
                alert("請先上傳圖片！");
                return;
            }

            // 切換 Loading 狀態
            const btn = document.getElementById('analyze-btn');
            const text = document.getElementById('analyze-text');
            const spinner = document.getElementById('analyze-spinner');
            
            btn.disabled = true;
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            text.innerText = "AI 努力辨識中...";
            spinner.classList.remove('hidden');

            // 呼叫 Gemini Vision API (✅ 已修正變數名為 GEMINI_API_KEY)
            try {
                const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{
                            parts: [
                                { text: `You are a helpful assistant. Please extract the menu items and prices from this image. 
                                         Return ONLY a valid JSON array. Do not wrap it in markdown code blocks like \`\`\`json. 
                                         The structure MUST be exactly like this: 
                                         [{"category": "Category Name", "items": [{"name": "Item Name", "price": 150}]}]` },
                                { inline_data: { mime_type: imageMimeType, data: base64Image } }
                            ]
                        }],
                        generationConfig: {
                            temperature: 0.1, // 降低隨機性，確保結構穩定
                        }
                    })
                });

                if (!response.ok) {
                    throw new Error(`API 請求失敗: ${response.status}`);
                }

                const data = await response.json();
                let rawText = data.candidates[0].content.parts[0].text;
                
                // 清理可能包含的 Markdown 格式
                rawText = rawText.replace(/```json/g, '').replace(/```/g, '').trim();
                
                parsedMenuData = JSON.parse(rawText);
                
                // 渲染校正表單
                renderEditorForm();
                
                // 顯示編輯區並加上淡入動畫
                const editorContainer = document.getElementById('editor-container');
                editorContainer.classList.remove('hidden');
                setTimeout(() => {
                    editorContainer.classList.remove('opacity-0', 'translate-y-4');
                }, 50);

            } catch (error) {
                console.error("AI 辨識錯誤:", error);
                alert("辨識失敗或 JSON 解析錯誤，請確認 API Key 或重試！\n錯誤訊息：" + error.message);
            } finally {
                // 恢復按鈕狀態
                btn.disabled = false;
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
                text.innerText = "重新辨識";
                spinner.classList.add('hidden');
            }
        }

        /**
         * ==========================================
         * 4. 動態渲染可編輯的表單 (校正用)
         * ==========================================
         */
        function renderEditorForm() {
            const formContainer = document.getElementById('editor-form');
            formContainer.innerHTML = ''; // 清空

            parsedMenuData.forEach((categoryBlock, cIndex) => {
                const section = document.createElement('div');
                section.className = "bg-slate-50 p-4 rounded-xl border border-slate-200";

                let html = `
                    <div class="mb-4 flex items-center gap-3">
                        <label class="font-bold text-slate-700 whitespace-nowrap">分類名稱:</label>
                        <input type="text" value="${categoryBlock.category}" 
                               onchange="updateData(${cIndex}, null, 'category', this.value)"
                               class="w-full max-w-xs px-3 py-2 border border-slate-300 rounded-md focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent">
                    </div>
                    <div class="overflow-x-auto">
                        <table class="w-full text-left bg-white rounded-lg overflow-hidden shadow-sm border border-slate-200">
                            <thead class="bg-slate-100 text-slate-600 text-sm">
                                <tr>
                                    <th class="px-4 py-3 font-medium">餐點名稱</th>
                                    <th class="px-4 py-3 font-medium w-32">價格</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                `;

                categoryBlock.items.forEach((item, iIndex) => {
                    html += `
                        <tr class="hover:bg-slate-50 transition-colors">
                            <td class="px-4 py-2">
                                <input type="text" value="${item.name}" 
                                       onchange="updateData(${cIndex}, ${iIndex}, 'name', this.value)"
                                       class="w-full px-2 py-1.5 border border-transparent hover:border-slate-300 focus:border-indigo-500 rounded-md bg-transparent focus:bg-white transition-all outline-none">
                            </td>
                            <td class="px-4 py-2">
                                <div class="flex items-center gap-1">
                                    <span class="text-slate-500">$</span>
                                    <input type="number" value="${item.price}" 
                                           onchange="updateData(${cIndex}, ${iIndex}, 'price', this.value)"
                                           class="w-full px-2 py-1.5 border border-transparent hover:border-slate-300 focus:border-indigo-500 rounded-md bg-transparent focus:bg-white transition-all outline-none">
                                </div>
                            </td>
                        </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                    </div>
                `;
                section.innerHTML = html;
                formContainer.appendChild(section);
            });
        }

        function updateData(cIndex, iIndex, field, value) {
            if (field === 'category') {
                parsedMenuData[cIndex].category = value;
            } else {
                parsedMenuData[cIndex].items[iIndex][field] = field === 'price' ? Number(value) : value;
            }
        }

        /**
         * ==========================================
         * 5. 發布菜單
         * ==========================================
         */
        function publishMenu() {
            if (parsedMenuData.length === 0) {
                alert("沒有資料可以發布！");
                return;
            }
            
            publishedMenuData = JSON.parse(JSON.stringify(parsedMenuData));
            switchTab('customer');
            alert("🎉 菜單發布成功！");
        }

        /**
         * ==========================================
         * 6. 顧客點餐前台邏輯
         * ==========================================
         */
        function renderCustomerMenu() {
            const emptyState = document.getElementById('empty-state');
            const menuDisplay = document.getElementById('menu-display');
            const menuGrid = document.getElementById('menu-grid');
            
            if (publishedMenuData.length === 0) {
                emptyState.classList.remove('hidden');
                menuDisplay.classList.add('hidden');
                return;
            }

            emptyState.classList.add('hidden');
            menuDisplay.classList.remove('hidden');
            menuGrid.innerHTML = '';

            publishedMenuData.forEach(categoryBlock => {
                const section = document.createElement('div');
                
                let html = `
                    <div>
                        <h2 class="text-xl font-bold text-slate-800 border-l-4 border-indigo-500 pl-3 mb-4">${categoryBlock.category}</h2>
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                `;

                categoryBlock.items.forEach(item => {
                    html += `
                        <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 hover:shadow-md transition-shadow flex flex-col justify-between h-full">
                            <div>
                                <h3 class="font-bold text-lg text-slate-800 mb-1">${item.name}</h3>
                                <p class="text-2xl font-black text-slate-700 mt-2"><span class="text-sm font-medium text-slate-400 mr-1">NT$</span>${item.price}</p>
                            </div>
                            <button onclick="addToCart('${item.name}', ${item.price})" class="mt-5 w-full bg-slate-900 hover:bg-indigo-600 text-white font-medium py-2 rounded-xl transition-colors flex items-center justify-center gap-2">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
                                加入購物車
                            </button>
                        </div>
                    `;
                });

                html += `
                        </div>
                    </div>
                `;
                section.innerHTML = html;
                menuGrid.appendChild(section);
            });
        }

        function addToCart(name, price) {
            cart.push({ name, price });
            document.getElementById('cart-count').innerText = cart.length;
            
            const countBadge = document.getElementById('cart-count');
            countBadge.classList.add('scale-150', 'text-emerald-500');
            setTimeout(() => {
                countBadge.classList.remove('scale-150', 'text-emerald-500');
            }, 300);
        }
    </script>
</body>
</html>
