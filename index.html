<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>美味線上點餐</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style> 
		body { font-family: 'Noto Sans TC', sans-serif; } 
		/* 隱藏 input type="number" 的預設上下箭頭 */
		input[type="number"]::-webkit-inner-spin-button, 
		input[type="number"]::-webkit-outer-spin-button { 
			-webkit-appearance: none; 
			margin: 0; 
		}
		input[type="number"] {
			-moz-appearance: textfield;
		}
	</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col relative">

    <nav class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 py-3 flex justify-between items-center h-16">
            <span class="text-xl font-bold text-indigo-600">美味點餐</span>
        </div>
    </nav>

    <main class="flex-grow max-w-5xl mx-auto w-full px-4 py-8">
        <!-- 讀取中狀態 -->
        <div id="loading-state" class="flex flex-col items-center justify-center py-20 text-slate-500">
            <svg class="animate-spin h-10 w-10 text-indigo-600 mb-4" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            <p>正在載入最新菜單...</p>
        </div>

        <!-- 菜單顯示區 -->
        <div id="menu-display" class="hidden">
            <div class="flex justify-between items-end mb-6 sticky top-16 bg-slate-50 py-4 z-30">
                <h1 class="text-3xl font-bold">點餐區</h1>
                <button onclick="openCartModal()" class="text-sm font-bold text-white bg-indigo-600 hover:bg-indigo-700 px-5 py-2.5 rounded-full shadow-lg transition-transform hover:scale-105">
                    購物車 (<span id="cart-count">0</span>)
                </button>
            </div>
            <div id="menu-grid" class="space-y-8"></div>
        </div>
    </main>

    <!-- 購物車 Modal -->
    <div id="cart-modal" class="fixed inset-0 bg-slate-900/60 z-50 hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-2xl shadow-2xl flex flex-col max-h-[90vh]" id="cart-modal-content">
            <div class="p-5 border-b border-slate-100 flex justify-between items-center">
                <h3 class="text-xl font-bold">您的購物車</h3>
                <button onclick="closeCartModal()" class="text-slate-400 hover:text-slate-600">✕</button>
            </div>
            
            <div class="p-5 overflow-y-auto flex-grow" id="cart-items-container"></div>

            <div class="p-5 border-t border-slate-100 bg-slate-50 rounded-b-2xl">
                <div class="flex justify-between items-center mb-4">
                    <span class="font-bold">總金額:</span>
                    <span class="text-2xl font-black text-indigo-600">NT$ <span id="cart-total-price">0</span></span>
                </div>
                <div class="mb-4">
                    <label class="block text-sm font-medium text-slate-700 mb-1">您的稱呼</label>
                    <input type="text" id="customer-name" placeholder="例如：王先生 或 3桌" class="w-full px-4 py-2 border rounded-lg focus:ring-2 outline-none">
                </div>
                <button id="submit-btn" onclick="submitOrder()" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-xl transition shadow-md">
                    確認送出訂單
                </button>
            </div>
        </div>
    </div>
	<!-- 單項餐點客製化視窗 -->
	<div id="item-modal" class="fixed inset-0 bg-slate-900/60 z-50 hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4">
		<div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-6">
			<h3 id="modal-item-name" class="text-xl font-bold mb-2">餐點名稱</h3>
			<p class="text-indigo-600 font-bold mb-4">NT$ <span id="modal-item-price">0</span></p>
			
			<div class="mb-4">
				<label class="block text-sm font-medium text-slate-700 mb-1">數量</label>
				<div class="flex items-center gap-3">
					<button onclick="changeQty(-1)" class="bg-slate-100 hover:bg-slate-200 w-10 h-10 rounded-full font-bold">-</button>
					<!-- 這裡改為 input 標籤，並加入 onchange 事件 -->
					<input type="number" id="modal-item-qty" value="1" min="1" onchange="handleManualQty(this.value)" class="text-lg font-bold w-16 h-10 text-center border border-slate-200 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none bg-slate-50">
					<button onclick="changeQty(1)" class="bg-slate-100 hover:bg-slate-200 w-10 h-10 rounded-full font-bold">+</button>
				</div>
			</div>

			<div class="mb-6">
				<label class="block text-sm font-medium text-slate-700 mb-1">備註 (選填)</label>
				<input type="text" id="modal-item-remark" placeholder="例如：不要蔥、微辣..." class="w-full px-3 py-2 border rounded-lg focus:ring-2 outline-none">
			</div>

			<div class="flex gap-3">
				<button onclick="closeItemModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-2 rounded-xl transition">取消</button>
				<button onclick="confirmAddToCart()" class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded-xl transition">確定加入</button>
			</div>
		</div>
	</div>
    <script>
        // ⚠️ 請填入與後台相同的 Google Apps Script URL
        const GAS_URL = "https://script.google.com/macros/s/AKfycbylSbLzr0dgEYS9YUNPYM2fQKLQDsFSmAepKf_WpkOqMNi48P37SVChNNOsyMFP7lySHg/exec"; 

        let publishedMenuData = [];
        let cart = [];
		let currentSelectedItem = null

        // 載入菜單
        async function fetchMenu() {
            if (!GAS_URL || GAS_URL.includes("YOUR_")) {
                document.getElementById('loading-state').innerHTML = "<p class='text-red-500'>請先設定 GAS_URL！</p>";
                return;
            }
            try {
                const res = await fetch(GAS_URL + '?action=getMenu');
                const result = await res.json();
                publishedMenuData = result.data || [];
                
                document.getElementById('loading-state').classList.add('hidden');
                
                if (publishedMenuData.length === 0) {
                    document.getElementById('loading-state').classList.remove('hidden');
                    document.getElementById('loading-state').innerHTML = "<h3>等待店家發布菜單中...</h3>";
                } else {
                    document.getElementById('menu-display').classList.remove('hidden');
                    renderMenu();
                }
            } catch(e) {
                document.getElementById('loading-state').innerHTML = "<p>載入失敗，請重新整理</p>";
            }
        }

        function renderMenu() {
            const grid = document.getElementById('menu-grid');
            grid.innerHTML = '';
            publishedMenuData.forEach(cat => {
                let html = `<div><h2 class="text-xl font-bold border-l-4 border-indigo-500 pl-3 mb-4">${cat.category}</h2><div class="grid grid-cols-1 sm:grid-cols-2 gap-4">`;
                cat.items.forEach(item => {
                    html += `<div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between"><h3 class="font-bold text-lg">${item.name}</h3><p class="text-xl font-black mt-2"><span class="text-sm">NT$</span>${item.price}</p><button onclick="openItemModal('${item.name}', ${item.price})" class="mt-4 bg-slate-100 hover:bg-indigo-600 hover:text-white font-medium py-2 rounded-xl transition">加入購物車</button></div>`;
                });
                grid.innerHTML += html + `</div></div>`;
            });
        }

        // 購物車邏輯
        // 1. 原本菜單卡片上的按鈕觸發此函數 (取代原本的 addToCart)
		function openItemModal(name, price) {
			currentSelectedItem = { name, price, qty: 1 };
			document.getElementById('modal-item-name').innerText = name;
			document.getElementById('modal-item-price').innerText = price;
			document.getElementById('modal-item-qty').value = 1; // 這裡改用 .value 賦值
			document.getElementById('modal-item-remark').value = '';
			
			const modal = document.getElementById('item-modal');
			modal.classList.remove('hidden');
			setTimeout(() => modal.classList.remove('opacity-0'), 10);
		}
		// 2. 數量增減
		function changeQty(delta) {
			let qtyInput = document.getElementById('modal-item-qty');
			let currentQty = parseInt(qtyInput.value) || 1;
			let newQty = currentQty + delta;
			if (newQty < 1) newQty = 1;
			
			currentSelectedItem.qty = newQty;
			qtyInput.value = newQty;
		}
		// 手動輸入數字鍵盤
		function handleManualQty(value) {
			let newQty = parseInt(value);
			// 防呆：如果輸入非數字或小於 1，就重置為 1
			if (isNaN(newQty) || newQty < 1) {
				newQty = 1;
			}
			currentSelectedItem.qty = newQty;
			document.getElementById('modal-item-qty').value = newQty;
		}
		function closeItemModal() {
			document.getElementById('item-modal').classList.add('opacity-0');
			setTimeout(() => document.getElementById('item-modal').classList.add('hidden'), 300);
		}

		// 3. 確認加入購物車
		function confirmAddToCart() {
			const remark = document.getElementById('modal-item-remark').value.trim();
			cart.push({
				name: currentSelectedItem.name,
				price: currentSelectedItem.price,
				qty: currentSelectedItem.qty,
				remark: remark
			});
			
			document.getElementById('cart-count').innerText = cart.length;
			closeItemModal();
		}
		function openCartModal() {
			const modal = document.getElementById('cart-modal');
			const itemsContainer = document.getElementById('cart-items-container');
			let total = 0;
			itemsContainer.innerHTML = '';

			if (cart.length === 0) {
				itemsContainer.innerHTML = '<p class="text-center text-slate-400 py-6">購物車是空的</p>';
			} else {
				cart.forEach((item, index) => {
					// 計算該品項總價 (單價 x 數量)
					let itemTotal = item.price * item.qty;
					total += itemTotal;
					
					// 如果有備註，才顯示備註文字
					let remarkHtml = item.remark ? `<p class="text-xs text-slate-500 mt-1">備註: ${item.remark}</p>` : '';

					itemsContainer.innerHTML += `
						<div class="flex justify-between items-center py-3 border-b border-slate-100">
							<div>
								<span class="font-medium text-slate-700">${item.name}</span>
								<!-- 顯示數量 -->
								<span class="text-indigo-600 font-bold ml-2">x ${item.qty}</span>
								${remarkHtml}
							</div>
							<div class="flex items-center gap-4">
								<span class="font-bold text-slate-600">$${itemTotal}</span>
								<button onclick="removeFromCart(${index})" class="text-red-400 hover:text-red-600 text-sm">刪除</button>
							</div>
						</div>
					`;
				});
			}
			
			document.getElementById('cart-total-price').innerText = total;
			modal.classList.remove('hidden');
			setTimeout(() => modal.classList.remove('opacity-0'), 10);
		}

        function closeCartModal() {
            document.getElementById('cart-modal').classList.add('opacity-0');
            setTimeout(() => document.getElementById('cart-modal').classList.add('hidden'), 300);
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            document.getElementById('cart-count').innerText = cart.length;
            openCartModal();
        }

        // 提交訂單到資料庫
        async function submitOrder() {
            if (cart.length === 0) return alert("購物車空的喔！");
            const customerName = document.getElementById('customer-name').value.trim();
            if (!customerName) return alert("請輸入稱呼或桌號！");

            const btn = document.getElementById('submit-btn');
            btn.disabled = true; btn.innerText = "傳送中...";

            const newOrder = {
                id: 'ORD-' + Math.floor(Math.random() * 10000),
                customerName: customerName,
                time: new Date().toLocaleString("zh-TW"),
                items: cart,
				total: cart.reduce((sum, item) => sum + (item.price * item.qty), 0),
                status: 'pending'
            };

            try {
                await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'addOrder', data: newOrder })
                });
                
                cart = [];
                document.getElementById('cart-count').innerText = "0";
                document.getElementById('customer-name').value = '';
                closeCartModal();
                alert(`✅ 訂單送出成功！店家已收到您的訂單。`);
            } catch(e) {
                alert("傳送失敗，請重試！");
            } finally {
                btn.disabled = false; btn.innerText = "確認送出訂單";
            }
        }

        // 網頁載入時啟動
        window.onload = fetchMenu;

    </script>
</body>
</html>
