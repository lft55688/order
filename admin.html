<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者後台 - AI 動態菜單系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 3px solid #ffffff; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .toggle-checkbox:checked { right: 0; border-color: #4f46e5; }
        .toggle-checkbox:checked + .toggle-label { background-color: #4f46e5; }
        .toggle-checkbox { right: 0; z-index: 1; border-color: #e2e8f0; transition: all 0.3s; }
        .toggle-label { background-color: #e2e8f0; transition: all 0.3s; }
        
        /* 隱藏 input number 上下箭頭 */
        input[type="number"]::-webkit-inner-spin-button, 
        input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col relative">

    <nav class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center text-xl font-bold text-indigo-600 gap-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    AI 系統 - 管理者後台
                </div>
                <div class="flex items-center space-x-4">
                    <a href="index.html" target="_blank" class="px-4 py-2 rounded-md font-medium text-sm transition-colors text-slate-600 hover:bg-slate-50 border border-slate-200">開啟顧客前台 ↗</a>
                </div>
            </div>
        </div>
    </nav>

    <!-- ================= 主控台畫面 ================= -->
    <main id="dashboard-view" class="flex-grow max-w-5xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 space-y-8 block">
        
        <!-- 區塊 1: 菜單清單管理 -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold flex items-center gap-2">1. 菜單管理列表</h2>
                <button onclick="openMenuEditor()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg font-bold shadow-sm transition">
                    ➕ 新增菜單
                </button>
            </div>
            <div id="loading-menus" class="text-slate-400 py-4 text-center">讀取菜單資料中...</div>
            <div id="no-menus" class="hidden text-center py-8 text-slate-400 bg-slate-50 rounded-xl border-2 border-dashed border-slate-200">
                目前沒有任何菜單，點擊上方按鈕建立第一個菜單吧！
            </div>
            <div id="menu-list-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
        </div>

<!-- 區塊 2: 顧客訂單管理 (退換餐編輯) -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold flex items-center gap-2 text-indigo-600">2. 顧客訂單管理 (退換餐編輯)</h2>
                <!-- 💡 更新：加入按鈕群組 (重整 + 清空) -->
                <div class="flex items-center gap-2">
                    <button onclick="fetchOrders()" class="text-sm bg-slate-100 text-slate-700 px-3 py-1.5 rounded hover:bg-slate-200 font-bold transition">🔄 重整訂單</button>
                    <button onclick="clearOrders()" class="text-sm bg-red-50 text-red-600 px-3 py-1.5 rounded hover:bg-red-100 font-bold transition">🗑️ 清空全部訂單</button>
                </div>
            </div>
            <p class="text-sm text-slate-500 mb-4">以顧客為單位的訂單列表，若顧客需要換餐或退單，請點擊編輯修改。</p>
            
            <div id="no-customer-orders" class="text-center py-10 text-slate-400">目前尚無訂單...</div>
            <div id="customer-orders-grid" class="grid grid-cols-1 md:grid-cols-3 gap-4 hidden"></div>
        </div>

        <!-- 區塊 3: 廚房看板 -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold flex items-center gap-2 text-amber-600">3. 依餐點分類整理及匯出</h2>
                <!-- 💡 更新：加入按鈕群組 (重整 + 清空) -->
                <div class="flex items-center gap-2">
                    <button onclick="fetchOrders()" class="text-sm bg-slate-100 text-slate-700 px-3 py-1.5 rounded hover:bg-slate-200 font-bold transition">🔄 重整看板</button>
                    <button onclick="clearOrders()" class="text-sm bg-red-50 text-red-600 px-3 py-1.5 rounded hover:bg-red-100 font-bold transition">🗑️ 清空全部訂單</button>
                </div>
            </div>
            <div id="no-orders" class="text-center py-10 text-slate-400">目前尚無訂單...</div>
            <div id="orders-container" class="space-y-8 hidden"></div>
        </div>
    </main>

    <!-- ================= 菜單編輯器畫面 ================= -->
    <main id="menu-editor-view" class="flex-grow max-w-5xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 space-y-6 hidden">
        <div class="flex justify-between items-center">
            <button onclick="closeMenuEditor()" class="text-slate-500 hover:text-slate-800 font-bold flex items-center gap-1">← 返回列表</button>
            <button id="save-btn" onclick="saveMenu()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-6 py-2 rounded-lg font-bold shadow-sm transition flex gap-2 items-center">
                <span id="save-text">💾 儲存此菜單</span>
                <div id="save-spinner" class="spinner hidden"></div>
            </button>
        </div>

        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div class="mb-6">
                <label class="block text-sm font-bold text-slate-700 mb-2">菜單名稱 (必填)</label>
                <input type="text" id="menu-name-input" placeholder="例如：午餐菜單、熱炒類..." class="w-full px-4 py-2 border border-slate-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none font-bold text-lg">
            </div>

            <div class="bg-slate-50 p-5 rounded-xl border border-slate-200 mb-6">
                <h3 class="font-bold text-slate-700 mb-2">上傳圖片交給 AI 生成/覆蓋內容 (選用)</h3>
                <div class="flex flex-col md:flex-row items-center gap-4">
                    <label class="flex-1 flex flex-col items-center justify-center w-full h-32 border-2 border-dashed border-slate-300 rounded-xl cursor-pointer bg-white hover:bg-slate-50 transition">
                        <div class="flex flex-col items-center justify-center pt-5 pb-6 text-slate-500">
                            <p class="mb-1 text-sm font-semibold">點擊上傳菜單圖片 (建議 2MB 內)</p>
                        </div>
                        <input type="file" accept="image/*" class="hidden" onchange="handleImageUpload(event)" />
                    </label>
                    <div id="preview-container" class="hidden flex-1 text-center">
                        <img id="image-preview" class="max-w-full h-auto max-h-24 rounded-lg border border-slate-200 shadow-sm mx-auto mb-2" />
                        <button id="analyze-btn" onclick="analyzeImage()" class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-1.5 rounded-lg font-medium text-sm">
                            <span id="analyze-text">傳送至後端 AI 辨識</span>
                            <div id="analyze-spinner" class="spinner hidden"></div>
                        </button>
                    </div>
                </div>
            </div>

            <div class="flex justify-between items-center mb-4 border-t border-slate-100 pt-6">
                <h2 class="text-lg font-bold">餐點資料編輯區</h2>
            </div>
            
            <div id="editor-form" class="space-y-6"></div>
            <div id="empty-editor-msg" class="text-center py-10 text-slate-400 bg-slate-50 rounded-xl border border-slate-200">
                目前沒有餐點資料，請上傳圖片交給 AI 辨識。
            </div>
        </div>
    </main>

    <!-- ================= 顧客訂單編輯視窗 (Modal) ================= -->
    <div id="edit-order-modal" class="fixed inset-0 bg-slate-900/60 z-50 hidden opacity-0 transition-opacity duration-300 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl flex flex-col max-h-[90vh]">
            <div class="p-5 border-b border-slate-100 flex justify-between items-center bg-slate-50 rounded-t-2xl">
                <div>
                    <h3 class="text-xl font-bold">編輯訂單</h3>
                    <p class="text-sm text-slate-500" id="edit-order-info">顧客: XXX</p>
                </div>
                <button onclick="closeEditOrderModal()" class="text-slate-400 hover:text-slate-600 text-2xl font-bold">✕</button>
            </div>
            
            <div class="p-5 overflow-y-auto flex-grow bg-white">
                <h4 class="font-bold text-sm text-slate-500 mb-2">已點餐點 (數量改為 0 即刪除)</h4>
                <div id="edit-order-items" class="space-y-3 mb-6">
                    <!-- 動態載入餐點 -->
                </div>

                <h4 class="font-bold text-sm text-indigo-500 border-t border-slate-100 pt-4 mb-2">➕ 手動為顧客新增餐點</h4>
                <div class="flex gap-2 items-center bg-indigo-50 p-3 rounded-lg border border-indigo-100">
                    <input type="text" id="add-new-item-name" placeholder="餐點名稱" class="flex-1 px-2 py-1.5 rounded border border-slate-300 text-sm outline-none">
                    <input type="number" id="add-new-item-price" placeholder="單價$" class="w-16 px-2 py-1.5 rounded border border-slate-300 text-sm outline-none">
                    <input type="number" id="add-new-item-qty" value="1" min="1" class="w-12 px-2 py-1.5 rounded border border-slate-300 text-sm text-center outline-none">
                    <button onclick="addCustomItemToOrder()" class="bg-indigo-600 text-white font-bold px-3 py-1.5 rounded hover:bg-indigo-700 text-sm">加入</button>
                </div>
            </div>

            <div class="p-5 border-t border-slate-100 bg-slate-50 rounded-b-2xl flex justify-between items-center">
                <div class="font-bold text-lg text-slate-700">新總額: <span class="text-indigo-600" id="edit-order-total">$0</span></div>
                <button onclick="saveEditedOrder()" class="bg-emerald-500 hover:bg-emerald-600 text-white font-bold px-6 py-2.5 rounded-xl transition shadow-md">
                    確認修改
                </button>
            </div>
        </div>
    </div>

    <script>
        // ⚠️ 請填入你最新部署的 GAS URL
        const GAS_URL = "https://script.google.com/macros/s/AKfycbylSbLzr0dgEYS9YUNPYM2fQKLQDsFSmAepKf_WpkOqMNi48P37SVChNNOsyMFP7lySHg/exec"; 

        let allMenus = [];
        let orders = [];
        let currentEditingMenuId = null; 
        let parsedMenuData = [];     
        let base64Image = "";
        let imageMimeType = "image/jpeg"; 

        let editingOrderData = null; // 暫存正在編輯的訂單

        // ================= 初始與讀取 =================
        async function fetchAllData() {
            if (!GAS_URL) return;
            try {
                const [menuRes, orderRes] = await Promise.all([fetch(GAS_URL + '?action=getMenu'), fetch(GAS_URL + '?action=getOrders')]);
                allMenus = (await menuRes.json()).data || [];
                orders = (await orderRes.json()).data || [];
                
                document.getElementById('loading-menus').classList.add('hidden');
                renderMenuList();
                renderCustomerOrders(); // 顧客列表
                renderAdminOrders();    // 廚房看板
            } catch (e) { console.error(e); }
        }

        async function fetchOrders() {
            if (!GAS_URL) return;
            try {
                const res = await fetch(GAS_URL + '?action=getOrders');
                orders = (await res.json()).data || [];
                renderCustomerOrders();
                renderAdminOrders();
            } catch(e) {}
        }

        // ================= 菜單列表與編輯 =================
        function renderMenuList() {
            const noMenus = document.getElementById('no-menus');
            const grid = document.getElementById('menu-list-grid');
            if (allMenus.length === 0) {
                noMenus.classList.remove('hidden'); grid.innerHTML = '';
                return;
            }
            noMenus.classList.add('hidden');
            grid.innerHTML = allMenus.map(menu => `
                <div class="bg-white p-5 rounded-xl border border-slate-200 flex flex-col justify-between shadow-sm">
                    <div class="flex justify-between items-start mb-4">
                        <h3 class="font-bold text-lg text-slate-800">${menu.name}</h3>
                        <div class="flex gap-2">
                            <button onclick="openMenuEditor('${menu.id}')" class="bg-slate-100 px-3 py-1.5 rounded hover:bg-slate-200 text-sm font-bold text-slate-600">編輯</button>
                            <button onclick="deleteMenu('${menu.id}')" class="bg-red-50 text-red-600 px-3 py-1.5 rounded hover:bg-red-100 text-sm font-bold">刪除</button>
                        </div>
                    </div>
                    <div class="flex justify-between items-center border-t border-slate-100 pt-3 mt-2">
                        <span class="text-sm text-slate-500">包含 ${menu.data.length} 個分類</span>
                        <div class="flex items-center gap-2 cursor-pointer select-none" onclick="togglePublish('${menu.id}')">
                            <span class="text-sm font-bold ${menu.isPublished ? 'text-emerald-600' : 'text-slate-400'}">${menu.isPublished ? '上架中' : '未發布'}</span>
                            <div class="relative inline-block w-10 mr-2 align-middle select-none pointer-events-none">
                                <input type="checkbox" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-4 appearance-none" ${menu.isPublished ? 'checked' : ''}/>
                                <label class="toggle-label block overflow-hidden h-5 rounded-full bg-gray-300"></label>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        async function togglePublish(id) {
            const menu = allMenus.find(m => m.id === id);
            if(menu) {
                menu.isPublished = !menu.isPublished;
                renderMenuList();
                try { await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'updateMenu', data: allMenus }) }); } catch(e) {}
            }
        }

        async function deleteMenu(id) {
            if(!confirm("確定要刪除這個菜單嗎？")) return;
            allMenus = allMenus.filter(m => m.id !== id);
            renderMenuList();
            try { await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'updateMenu', data: allMenus }) }); } catch(e) {}
        }

        function openMenuEditor(id = null) {
            currentEditingMenuId = id;
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('menu-editor-view').classList.remove('hidden');
            document.getElementById('preview-container').classList.add('hidden');
            base64Image = "";

            if (id) {
                const menu = allMenus.find(m => m.id === id);
                document.getElementById('menu-name-input').value = menu.name;
                parsedMenuData = JSON.parse(JSON.stringify(menu.data)); 
            } else {
                document.getElementById('menu-name-input').value = "";
                parsedMenuData = [];
            }
            renderEditorForm();
        }

        function closeMenuEditor() {
            document.getElementById('dashboard-view').classList.remove('hidden');
            document.getElementById('menu-editor-view').classList.add('hidden');
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            imageMimeType = file.type || "image/jpeg";
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('image-preview').src = e.target.result;
                document.getElementById('preview-container').classList.remove('hidden');
                base64Image = e.target.result.split(',')[1];
            };
            reader.readAsDataURL(file);
        }

        async function analyzeImage() {
            if (!base64Image) return alert("請先上傳圖片！");
            const btn = document.getElementById('analyze-btn'), text = document.getElementById('analyze-text'), spinner = document.getElementById('analyze-spinner');
            btn.disabled = true; text.innerText = "AI 努力辨識中..."; spinner.classList.remove('hidden');

            try {
                const response = await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'analyzeImage', base64Image: base64Image, mimeType: imageMimeType }) });
                const result = await response.json();
                if (result.status === 'error') throw new Error(result.message);
                parsedMenuData = result.data;
                renderEditorForm();
            } catch (e) { alert("辨識失敗：" + e.message); } finally {
                btn.disabled = false; text.innerText = "重新辨識"; spinner.classList.add('hidden');
            }
        }

        function renderEditorForm() {
            const container = document.getElementById('editor-form');
            const emptyMsg = document.getElementById('empty-editor-msg');
            container.innerHTML = '';
            
            if(parsedMenuData.length === 0) {
                emptyMsg.classList.remove('hidden'); return;
            }
            emptyMsg.classList.add('hidden');

            parsedMenuData.forEach((cat, cIndex) => {
                let html = `<div class="bg-slate-50 p-4 rounded-xl border border-slate-200">
                    <input type="text" value="${cat.category}" onchange="updateData(${cIndex}, null, 'category', this.value)" class="mb-3 px-3 py-1.5 border border-slate-300 rounded focus:ring-2 focus:ring-indigo-500 w-full max-w-xs font-bold outline-none">
                    <table class="w-full bg-white rounded shadow-sm border border-slate-200 mb-2"><tbody>`;
                
                cat.items.forEach((item, iIndex) => {
                    html += `<tr>
                        <td class="p-2 border-b"><input type="text" value="${item.name}" onchange="updateData(${cIndex}, ${iIndex}, 'name', this.value)" class="w-full p-1.5 border border-transparent hover:border-slate-300 focus:border-indigo-500 rounded outline-none"></td>
                        <td class="p-2 border-b w-24"><input type="number" value="${item.price}" onchange="updateData(${cIndex}, ${iIndex}, 'price', this.value)" class="w-full p-1.5 border border-transparent hover:border-slate-300 focus:border-indigo-500 rounded outline-none"></td>
                    </tr>`;
                });
                
                html += `</tbody></table>
                    <!-- 💡 新增品項按鈕 -->
                    <button onclick="addMenuItem(${cIndex})" class="w-full py-2 text-sm text-indigo-600 font-bold hover:bg-indigo-100 rounded transition border border-dashed border-indigo-200 bg-indigo-50/50">➕ 新增品項至此分類</button>
                </div>`;
                container.innerHTML += html;
            });
        }

        // 💡 處理手動新增品項
        function addMenuItem(cIndex) {
            parsedMenuData[cIndex].items.push({ name: "手動新增餐點", price: 0 });
            renderEditorForm();
        }

        function updateData(c, i, f, v) { i === null ? parsedMenuData[c][f] = v : parsedMenuData[c].items[i][f] = f === 'price' ? Number(v) : v; }

        async function saveMenu() {
            const nameInput = document.getElementById('menu-name-input').value.trim();
            if (!nameInput) return alert("請輸入菜單名稱！");
            
            const btn = document.getElementById('save-btn'), text = document.getElementById('save-text'), spinner = document.getElementById('save-spinner');
            btn.disabled = true; text.innerText = "儲存中..."; spinner.classList.remove('hidden');

            if (currentEditingMenuId) {
                const menu = allMenus.find(m => m.id === currentEditingMenuId);
                menu.name = nameInput; menu.data = parsedMenuData;
            } else {
                allMenus.push({ id: 'MENU-' + Date.now(), name: nameInput, isPublished: false, data: parsedMenuData });
            }

            try {
                await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'updateMenu', data: allMenus }) });
                alert("🎉 儲存成功！");
                renderMenuList();
                closeMenuEditor();
            } catch(e) { alert("儲存失敗：" + e); } finally {
                btn.disabled = false; text.innerText = "💾 儲存此菜單"; spinner.classList.add('hidden');
            }
        }

        // ================= 顧客訂單管理 (退換餐編輯) =================
        function renderCustomerOrders() {
            const grid = document.getElementById('customer-orders-grid');
            const noOrders = document.getElementById('no-customer-orders');
            
            if (orders.length === 0) {
                noOrders.classList.remove('hidden'); grid.classList.add('hidden'); return;
            }
            noOrders.classList.add('hidden'); grid.classList.remove('hidden');
            
            grid.innerHTML = orders.map(order => `
                <div class="bg-white border border-slate-200 p-4 rounded-xl shadow-sm flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <span class="font-bold text-lg text-slate-800">${order.customerName}</span>
                            <span class="text-xs text-slate-400">${order.time}</span>
                        </div>
                        <p class="text-sm text-slate-500 mb-3 truncate" title="${order.items.map(i=>i.name).join(', ')}">
                            ${order.items.map(i=>i.name).join(', ')}
                        </p>
                    </div>
                    <div class="flex justify-between items-center border-t border-slate-100 pt-3">
                        <span class="font-black text-indigo-600">$${order.total}</span>
                        <button onclick="openEditOrderModal('${order.id}')" class="bg-slate-100 text-slate-700 hover:bg-slate-200 px-3 py-1.5 rounded text-sm font-bold transition">✏️ 編輯</button>
                    </div>
                </div>
            `).join('');
        }

        function openEditOrderModal(orderId) {
            const order = orders.find(o => o.id === orderId);
            if(!order) return;
            // 💡 深拷貝，以免未按儲存就更動到原始資料
            editingOrderData = JSON.parse(JSON.stringify(order));
            
            document.getElementById('edit-order-info').innerText = `顧客/桌號: ${order.customerName} | 單號: ${order.id}`;
            document.getElementById('add-new-item-name').value = '';
            document.getElementById('add-new-item-price').value = '';
            document.getElementById('add-new-item-qty').value = '1';

            renderEditOrderItems();
            const modal = document.getElementById('edit-order-modal');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.remove('opacity-0'), 10);
        }

        function closeEditOrderModal() {
            const modal = document.getElementById('edit-order-modal');
            modal.classList.add('opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 300);
            editingOrderData = null;
        }

        function renderEditOrderItems() {
            const container = document.getElementById('edit-order-items');
            let total = 0;
            
            container.innerHTML = editingOrderData.items.map((item, index) => {
                const subtotal = item.price * item.qty;
                total += subtotal;
                return `
                    <div class="flex items-center gap-3 border-b border-slate-100 pb-2">
                        <div class="flex-1">
                            <div class="font-bold text-slate-800 text-sm">${item.name}</div>
                            <div class="text-xs text-slate-500">單價: $${item.price} ${item.remark && item.remark !== '無' ? `| 備註: ${item.remark}` : ''}</div>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="text-xs font-bold text-slate-400">數量:</span>
                            <input type="number" min="0" value="${item.qty}" onchange="updateEditItemQty(${index}, this.value)" class="w-12 h-8 text-center border border-slate-300 rounded font-bold outline-none focus:ring-1 focus:ring-indigo-500">
                        </div>
                        <div class="w-12 text-right font-bold text-slate-700 text-sm">$${subtotal}</div>
                    </div>
                `;
            }).join('');
            
            if (editingOrderData.items.length === 0) {
                container.innerHTML = `<p class="text-sm text-red-500 font-bold py-2">此訂單所有餐點已移除，若按下儲存將會刪除整筆訂單。</p>`;
            }
            editingOrderData.total = total;
            document.getElementById('edit-order-total').innerText = `$${total}`;
        }

        function updateEditItemQty(index, newQty) {
            let qty = parseInt(newQty);
            if (isNaN(qty) || qty < 0) qty = 0;
            
            if (qty === 0) {
                if(confirm("數量為 0，確定要刪除此餐點嗎？")) {
                    editingOrderData.items.splice(index, 1);
                }
            } else {
                editingOrderData.items[index].qty = qty;
            }
            renderEditOrderItems();
        }

        function addCustomItemToOrder() {
            const name = document.getElementById('add-new-item-name').value.trim();
            const price = parseInt(document.getElementById('add-new-item-price').value);
            const qty = parseInt(document.getElementById('add-new-item-qty').value);
            
            if (!name || isNaN(price) || isNaN(qty) || qty < 1) return alert("請輸入正確的餐點名稱、單價與數量！");
            
            editingOrderData.items.push({
                name: name,
                price: price,
                qty: qty,
                remark: '後台手動新增',
                menuName: '退換餐/客製' // 讓看板能歸類
            });
            
            document.getElementById('add-new-item-name').value = '';
            document.getElementById('add-new-item-price').value = '';
            document.getElementById('add-new-item-qty').value = '1';
            renderEditOrderItems();
        }

        async function saveEditedOrder() {
            // 找出原本訂單在 orders 陣列中的位置
            const targetIndex = orders.findIndex(o => o.id === editingOrderData.id);
            if(targetIndex === -1) return;

            if (editingOrderData.items.length === 0) {
                orders.splice(targetIndex, 1); // 如果沒有餐點了，整筆刪除
            } else {
                orders[targetIndex] = editingOrderData; // 覆蓋舊資料
            }

            try {
                // 呼叫後端覆蓋訂單資料庫
                await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'updateOrders', data: orders }) });
                
                closeEditOrderModal();
                renderCustomerOrders(); // 重整顧客視角
                renderAdminOrders();    // 重整廚房視角
                alert("✅ 訂單修改成功！");
            } catch(e) {
                alert("儲存失敗：" + e);
            }
        }

        // ================= 廚房看板管理 (依舊保留) =================
        function renderAdminOrders() {
            const noOrders = document.getElementById('no-orders');
            const ordersContainer = document.getElementById('orders-container');
            
            if (orders.length === 0) {
                noOrders.classList.remove('hidden'); ordersContainer.classList.add('hidden'); return;
            }
            noOrders.classList.add('hidden'); ordersContainer.classList.remove('hidden');
            ordersContainer.innerHTML = '';

            const groupedByMenu = {};
            orders.forEach(order => {
                order.items.forEach(item => {
                    const mName = item.menuName || '未分類餐點 (舊資料)';
                    const iName = item.name;
                    const price = item.price || 0;
                    const qty = item.qty || 1;

                    if (!groupedByMenu[mName]) groupedByMenu[mName] = {};
                    if (!groupedByMenu[mName][iName]) groupedByMenu[mName][iName] = { totalQty: 0, price: price, totalAmount: 0, customers: [] };
                    
                    groupedByMenu[mName][iName].totalQty += qty;
                    groupedByMenu[mName][iName].totalAmount += (price * qty);
                    groupedByMenu[mName][iName].customers.push({ customerName: order.customerName, qty: qty, remark: item.remark || '無', time: order.time });
                });
            });

            for (const [menuName, itemsData] of Object.entries(groupedByMenu)) {
                let itemsHTML = '';
                for (const [itemName, data] of Object.entries(itemsData)) {
                    let customerListHTML = data.customers.map(c => 
                        `<li class="border-b border-slate-100 py-2 text-sm flex justify-between">
                            <div><span class="font-bold">${c.customerName}</span><span class="text-slate-400 text-xs ml-2">${c.time}</span><br><span class="text-red-500 text-xs font-bold">備註: ${c.remark}</span></div>
                            <span class="font-bold text-indigo-600">x${c.qty}</span>
                         </li>`
                    ).join('');

                    itemsHTML += `
                        <div class="bg-white border-2 border-indigo-100 p-4 rounded-xl shadow-sm">
                            <div class="flex justify-between items-center mb-1 pb-1 border-b border-slate-100">
                                <h3 class="text-lg font-black text-slate-800">${itemName}</h3>
                                <span class="bg-indigo-600 text-white px-2 py-1 rounded text-sm font-bold">總數: ${data.totalQty}</span>
                            </div>
                            <div class="text-xs text-slate-500 font-bold mb-3 flex justify-between">
                                <span>單價: $${data.price}</span><span class="text-indigo-600">本項總額: $${data.totalAmount}</span>
                            </div>
                            <ul>${customerListHTML}</ul>
                        </div>
                    `;
                }

                ordersContainer.innerHTML += `
                    <div class="bg-slate-50 p-5 rounded-2xl border border-slate-200">
                        <div class="flex justify-between items-center mb-4 border-b-2 border-slate-200 pb-3">
                            <h3 class="text-xl font-black text-indigo-800 border-l-4 border-indigo-500 pl-3">${menuName}</h3>
                            <button onclick="exportMenuPDF('${menuName}')" class="text-sm bg-blue-600 text-white font-bold px-4 py-2 rounded-lg shadow-sm hover:bg-blue-700 transition">📄 匯出此區 PDF</button>
                        </div>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">${itemsHTML}</div>
                    </div>
                `;
            }
        }

        async function exportMenuPDF(targetMenuName) {
            const itemMap = {}; let grandTotalAmount = 0; let grandTotalPortions = 0; 

            orders.forEach(order => {
                const cName = order.customerName || '未知桌號';
                const cTime = order.time || '';
                if (Array.isArray(order.items)) {
                    order.items.forEach(item => {
                        const mName = item.menuName || '未分類餐點 (舊資料)';
                        if (mName !== targetMenuName) return; 
                        const itemName = item.name || '未命名餐點';
                        const qty = Number(item.qty || 1); const price = Number(item.price) || 0;
                        const subtotal = price * qty; const cNote = item.remark || '無';
                        if (!itemMap[itemName]) itemMap[itemName] = { totalPortions: 0, totalQty: 0, totalAmount: 0, unitPrice: price, customers: [] };
                        itemMap[itemName].totalPortions += 1; itemMap[itemName].totalQty += qty; itemMap[itemName].totalAmount += subtotal;
                        itemMap[itemName].customers.push({ customerName: cName, time: cTime, qty: qty, subtotal: subtotal, note: cNote });
                        grandTotalPortions += 1; grandTotalAmount += subtotal;
                    });
                }
            });

            let contentHtml = `
                <div style="width: 100%; max-width: 700px; margin: 0 auto; padding: 10px; font-family: sans-serif; color: #1e293b; background-color: #ffffff;">
                    <div style="text-align: center; margin-bottom: 20px; border-bottom: 2px solid #4f46e5; padding-bottom: 12px;">
                        <h1 style="font-size: 22px; font-weight: bold; margin: 0; color: #4f46e5;">廚房統計單：${targetMenuName}</h1>
                        <p style="font-size: 12px; color: #64748b; margin-top: 5px;">匯出時間：${new Date().toLocaleString()} | 點餐筆數：<b>${grandTotalPortions}</b> 筆 | 總額：<b>$${grandTotalAmount}</b></p>
                    </div>
                    <div>
            `;

            Object.keys(itemMap).forEach(itemName => {
                const data = itemMap[itemName];
                contentHtml += `
                        <div style="margin-bottom: 15px; border: 1.5px solid #e0e7ff; border-radius: 8px; padding: 12px; background: #ffffff; page-break-inside: avoid; break-inside: avoid;">
                            <table style="width: 100%; border-collapse: collapse; border-bottom: 1px solid #f1f5f9; margin-bottom: 8px; padding-bottom: 8px;">
                                <tr>
                                    <td style="text-align: left; vertical-align: middle;"><span style="font-size: 16px; font-weight: bold; color: #0f172a;">${itemName}</span><span style="font-size: 12px; color: #64748b; margin-left: 6px;">(單價 $${data.unitPrice})</span></td>
                                    <td style="text-align: right; vertical-align: middle; width: 150px;"><span style="background: #4338ca; color: #ffffff; font-weight: bold; font-size: 12px; padding: 4px 10px; border-radius: 4px;">總數 : ${data.totalPortions} 筆 (共 ${data.totalQty} 個)</span></td>
                                </tr>
                            </table>
                            <table style="width: 100%; border-collapse: collapse;">
                `;
                data.customers.forEach(c => {
                    const noteColor = c.note !== '無' ? '#dc2626' : '#94a3b8';
                    const noteWeight = c.note !== '無' ? 'bold' : 'normal';
                    contentHtml += `
                                <tr>
                                    <td style="border-bottom: 1px dashed #f1f5f9; padding: 6px 0; text-align: left;"><div style="margin-bottom: 2px;"><span style="font-weight: bold; font-size: 14px; color: #0f172a; margin-right: 8px;">${c.customerName}</span><span style="font-size: 11px; color: #94a3b8;">${c.time}</span></div><div style="font-size: 12px; color: ${noteColor}; font-weight: ${noteWeight};">備註：${c.note}</div></td>
                                    <td style="border-bottom: 1px dashed #f1f5f9; padding: 6px 0; text-align: right; vertical-align: top; width: 100px;"><span style="font-weight: bold; color: #4338ca; font-size: 14px; margin-right: 10px;">x${c.qty}</span><span style="font-size: 13px; font-weight: bold; color: #334155;">$${c.subtotal}</span></td>
                                </tr>
                    `;
                });
                contentHtml += `</table><div style="text-align: right; font-size: 12px; font-weight: bold; color: #4f46e5; margin-top: 8px;">小計：$${data.totalAmount}</div></div>`;
            });
            contentHtml += `</div></div>`;

            const opt = {
                margin: 0.3, filename: `廚房統計_${targetMenuName}_${new Date().toLocaleDateString()}.pdf`,
                image: { type: 'jpeg', quality: 0.98 },
                html2canvas: { scale: 2, useCORS: true, logging: false, scrollY: 0 },
                jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' },
                pagebreak: { mode: ['avoid-all', 'css'] }
            };
            const currentScrollY = window.scrollY; window.scrollTo(0, 0);
            try { await html2pdf().set(opt).from(contentHtml).save(); } catch (e) { alert("匯出失敗：" + e.message); } finally { window.scrollTo(0, currentScrollY); }
        }

        async function clearOrders() {
            if (!confirm("⚠️ 確定要清空資料庫中所有的訂單嗎？")) return;
            try {
                await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'clearOrders' }) });
                orders = [];
                renderCustomerOrders();
                renderAdminOrders();
                alert("訂單已全部清除！");
            } catch(e) { alert("清除失敗：" + e); }
        }

        window.onload = fetchAllData;
        setInterval(fetchOrders, 10000); 

    </script>
</body>
</html>
