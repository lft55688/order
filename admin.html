<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>管理者後台 - AI 動態菜單系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Noto Sans TC', sans-serif; }
        .spinner { border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top: 3px solid #ffffff; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col relative">

    <nav class="bg-white shadow-sm border-b border-slate-200 sticky top-0 z-40">
        <div class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16">
                <div class="flex items-center text-xl font-bold text-indigo-600 gap-2">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                    AI 系統 - 管理者後台
                </div>
                <div class="flex items-center space-x-4">
                    <a href="index.html" target="_blank" class="px-4 py-2 rounded-md font-medium text-sm transition-colors text-slate-600 hover:bg-slate-50 border border-slate-200">開啟顧客前台 ↗</a>
                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-5xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8 space-y-8">
        
        <!-- 區塊 1: 菜單管理 -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <h2 class="text-xl font-bold mb-4 flex items-center gap-2">1. 菜單管理 (上傳交給後端 AI 辨識)</h2>
            <div class="flex items-center justify-center w-full">
                <label class="flex flex-col items-center justify-center w-full h-40 border-2 border-dashed border-slate-300 rounded-xl cursor-pointer bg-slate-50 hover:bg-slate-100 transition">
                    <div class="flex flex-col items-center justify-center pt-5 pb-6 text-slate-500">
                        <p class="mb-2 text-sm font-semibold">點擊上傳菜單圖片 (建議 2MB 內)</p>
                    </div>
                    <input type="file" accept="image/*" class="hidden" onchange="handleImageUpload(event)" />
                </label>
            </div>
            <div id="preview-container" class="hidden mt-6 text-center">
                <img id="image-preview" class="max-w-full h-auto max-h-48 rounded-lg border border-slate-200 shadow-sm mx-auto mb-4" />
                <button id="analyze-btn" onclick="analyzeImage()" class="inline-flex items-center gap-2 bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-2.5 rounded-lg font-medium">
                    <span id="analyze-text">傳送至後端 AI 辨識</span>
                    <div id="analyze-spinner" class="spinner hidden"></div>
                </button>
            </div>
        </div>

        <!-- 區塊 2: 人工校正區塊 -->
        <div id="editor-container" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-slate-100 transition-all duration-500">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-lg font-bold">人工校正區</h2>
                <button id="publish-btn" onclick="publishMenu()" class="bg-emerald-500 hover:bg-emerald-600 text-white px-5 py-2 rounded-lg font-medium flex gap-2 items-center">
                    <span id="publish-text">發布覆蓋菜單</span>
                    <div id="publish-spinner" class="spinner hidden"></div>
                </button>
            </div>
            <div id="editor-form" class="space-y-6"></div>
        </div>

        <!-- 區塊 3: 訂單看板 -->
        <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-bold flex items-center gap-2 text-amber-600">2. 即時訂單看板 (自動更新)</h2>
                <div class="flex items-center gap-2">
				<button onclick="fetchOrders()" class="text-sm bg-slate-100 px-3 py-1.5 rounded hover:bg-slate-200">🔄 重整</button>
				<button onclick="exportToPDF()" class="text-sm bg-blue-100 text-blue-700 px-3 py-1.5 rounded hover:bg-blue-200">📄 匯出 PDF</button>
				<button onclick="clearOrders()" class="text-sm bg-red-100 text-red-700 px-3 py-1.5 rounded hover:bg-red-200">🗑️ 清除所有訂單</button>
				</div>
            </div>
            <div id="no-orders" class="text-center py-10 text-slate-400">目前尚無新訂單或載入中...</div>
            <div id="orders-grid" class="grid grid-cols-1 md:grid-cols-2 gap-4 hidden"></div>
        </div>

    </main>

    <script>
        // ⚠️ 只要填這一個：將你新部署好的 GAS URL 貼上來
        const GAS_URL = "https://script.google.com/macros/s/AKfycbylSbLzr0dgEYS9YUNPYM2fQKLQDsFSmAepKf_WpkOqMNi48P37SVChNNOsyMFP7lySHg/exec"; 

        let base64Image = "";
        let imageMimeType = "image/jpeg"; 
        let parsedMenuData = [];     
        let orders = [];             

        // 圖片上傳與預覽
        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            // 提醒：GAS 傳遞大檔案較慢，建議不要超過 5MB
            if (file.size > 5 * 1024 * 1024) {
                alert("圖片檔案過大，請選擇 5MB 以下的圖片以加速傳輸。");
            }

            imageMimeType = file.type || "image/jpeg";
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('image-preview').src = e.target.result;
                document.getElementById('preview-container').classList.remove('hidden');
                // 取出純 base64 碼
                base64Image = e.target.result.split(',')[1];
            };
            reader.readAsDataURL(file);
        }

        // 把圖片交給 GAS，讓 GAS 呼叫 Gemini AI (解決 GitHub 擋 API Key 的問題)
        async function analyzeImage() {
            if (!base64Image) return alert("請先上傳圖片！");
            if (!GAS_URL || GAS_URL.includes("YOUR_")) return alert("請先設定 GAS_URL！");

            const btn = document.getElementById('analyze-btn'), text = document.getElementById('analyze-text'), spinner = document.getElementById('analyze-spinner');
            btn.disabled = true; text.innerText = "後端 AI 努力辨識中..."; spinner.classList.remove('hidden');

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'analyzeImage',
                        base64Image: base64Image,
                        mimeType: imageMimeType
                    })
                });
                
                const result = await response.json();
                
                if (result.status === 'error') {
                    throw new Error(result.message);
                }
                
                // 取得後端傳回來的解析結果
                parsedMenuData = result.data;
                
                renderEditorForm();
                document.getElementById('editor-container').classList.remove('hidden');
            } catch (e) {
                console.error(e);
                alert("辨識失敗：" + e.message);
            } finally {
                btn.disabled = false; text.innerText = "重新辨識"; spinner.classList.add('hidden');
            }
        }

        // 渲染編輯表單
        function renderEditorForm() {
            const container = document.getElementById('editor-form');
            container.innerHTML = '';
            parsedMenuData.forEach((cat, cIndex) => {
                let html = `<div class="bg-slate-50 p-4 rounded-xl border border-slate-200"><input type="text" value="${cat.category}" onchange="updateData(${cIndex}, null, 'category', this.value)" class="mb-3 px-3 py-1 border rounded w-full max-w-xs font-bold"><table class="w-full bg-white rounded shadow-sm"><tbody>`;
                cat.items.forEach((item, iIndex) => {
                    html += `<tr><td class="p-2 border-b"><input type="text" value="${item.name}" onchange="updateData(${cIndex}, ${iIndex}, 'name', this.value)" class="w-full p-1 border rounded"></td><td class="p-2 border-b w-24"><input type="number" value="${item.price}" onchange="updateData(${cIndex}, ${iIndex}, 'price', this.value)" class="w-full p-1 border rounded"></td></tr>`;
                });
                container.innerHTML += html + `</tbody></table></div>`;
            });
        }

        function updateData(c, i, f, v) { i === null ? parsedMenuData[c][f] = v : parsedMenuData[c].items[i][f] = f === 'price' ? Number(v) : v; }

        // 上傳菜單到資料庫
        async function publishMenu() {
            if (parsedMenuData.length === 0) return alert("沒有資料");
            if (!GAS_URL || GAS_URL.includes("YOUR_")) return alert("請設定 GAS_URL！");

            const btn = document.getElementById('publish-btn'), text = document.getElementById('publish-text'), spinner = document.getElementById('publish-spinner');
            btn.disabled = true; text.innerText = "上傳中..."; spinner.classList.remove('hidden');

            try {
                await fetch(GAS_URL, {
                    method: 'POST',
                    body: JSON.stringify({ action: 'updateMenu', data: parsedMenuData })
                });
                alert("🎉 菜單發布/覆蓋成功！");
            } catch(e) {
                alert("上傳失敗：" + e);
            } finally {
                btn.disabled = false; text.innerText = "發布覆蓋菜單"; spinner.classList.add('hidden');
            }
        }

        // 定期讀取訂單
        async function fetchOrders() {
            if (!GAS_URL || GAS_URL.includes("YOUR_")) return;
            try {
                const res = await fetch(GAS_URL + '?action=getOrders');
                const result = await res.json();
                orders = result.data || [];
                renderAdminOrders();
            } catch(e) { console.error("獲取訂單失敗", e); }
        }

        function renderAdminOrders() {
			const noOrders = document.getElementById('no-orders');
			const ordersGrid = document.getElementById('orders-grid');
			if (orders.length === 0) {
				noOrders.classList.remove('hidden'); ordersGrid.classList.add('hidden');
				return;
			}
			noOrders.classList.add('hidden'); ordersGrid.classList.remove('hidden');
			ordersGrid.innerHTML = '';

			// 1. 將訂單資料轉換為「以餐點分組」的結構
			const groupedItems = {};
			orders.forEach(order => {
				order.items.forEach(item => {
					if (!groupedItems[item.name]) {
						groupedItems[item.name] = { totalQty: 0, customers: [] };
					}
					// 這裡兼容舊資料沒有 qty 的情況 (預設1)
					const itemQty = item.qty || 1; 
					groupedItems[item.name].totalQty += itemQty;
					groupedItems[item.name].customers.push({
						customerName: order.customerName,
						qty: itemQty,
						remark: item.remark || '無',
						time: order.time
					});
				});
			});

			// 2. 渲染畫面 (一格就是一個餐點，裡面列出點餐的顧客)
			for (const [itemName, data] of Object.entries(groupedItems)) {
				let customerListHTML = data.customers.map(c => 
					`<li class="border-b border-slate-100 py-2 text-sm flex justify-between">
						<div>
							<span class="font-bold">${c.customerName}</span> 
							<span class="text-slate-400 text-xs ml-2">${c.time}</span>
							<br>
							<span class="text-red-500 text-xs">備註: ${c.remark}</span>
						</div>
						<span class="font-bold text-indigo-600">x${c.qty}</span>
					 </li>`
				).join('');

				ordersGrid.innerHTML += `
					<div class="bg-white border-2 border-indigo-100 p-4 rounded-xl shadow-sm">
						<div class="flex justify-between items-center mb-3 pb-2 border-b border-indigo-200">
							<h3 class="text-lg font-black text-slate-800">${itemName}</h3>
							<span class="bg-indigo-600 text-white px-2 py-1 rounded text-sm font-bold">總數: ${data.totalQty}</span>
						</div>
						<ul>${customerListHTML}</ul>
					</div>
				`;
			}
		}
		// 匯出 PDF
		function exportToPDF() {
			const element = document.getElementById('orders-grid');
			if(orders.length === 0) return alert("目前沒有訂單可以匯出！");
			
			// 設定 PDF 參數
			const opt = {
				margin: 0.5,
				filename: `廚房備餐單_${new Date().toLocaleDateString()}.pdf`,
				image: { type: 'jpeg', quality: 0.98 },
				html2canvas: { scale: 2 },
				jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
			};
			// 呼叫 html2pdf
			html2pdf().set(opt).from(element).save();
		}

		// 呼叫後端清除訂單
		async function clearOrders() {
			if (!confirm("⚠️ 確定要清除看板上所有的訂單嗎？這將會清空資料庫！")) return;
			try {
				await fetch(GAS_URL, {
					method: 'POST',
					body: JSON.stringify({ action: 'clearOrders' })
				});
				orders = [];
				renderAdminOrders();
				alert("訂單已全部清除！");
			} catch(e) {
				alert("清除失敗：" + e);
			}
		}

        // 網頁載入時與每10秒自動更新訂單
        window.onload = fetchOrders;
        setInterval(fetchOrders, 10000); 

    </script>
</body>
</html>
